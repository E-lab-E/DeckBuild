<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>デッキ入替アシスタント</title>
<style>
  :root{
    --bg:#14151a;
    --surface:#1c1e26;
    --surface2:#23252f;
    --border:#33354a;
    --text:#e9e7e0;
    --muted:#8f909e;
    --gold:#d4af37;
    --gold-dim:#8a7530;
    --danger:#c1443c;
    --danger-dim:#7a2e28;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px;}
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:.3px;
    margin:0 0 4px;
  }
  .sub{color:var(--muted);font-size:13px;margin:0 0 24px;line-height:1.6;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px;
    margin-bottom:16px;
  }
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .btn{
    background:var(--surface2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 14px;
    border-radius:7px;
    font-size:13px;
    cursor:pointer;
    transition:border-color .15s;
  }
  .btn:hover{border-color:var(--gold-dim);}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1704;font-weight:600;}
  .btn.primary:hover{background:#e0bd45;}
  .btn.danger{border-color:var(--danger-dim);color:#f0a49e;}
  .btn.danger:hover{border-color:var(--danger);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);}
  .btn.ghost:hover{color:var(--text);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .pill{
    padding:7px 16px;border-radius:20px;border:1px solid var(--border);
    background:var(--surface2);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:7px;
  }
  .pill.active{border-color:var(--gold);color:#f5e6a8;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  input[type=text], textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:7px;font-size:14px;font-family:inherit;
  }
  textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;resize:vertical;}
  label{font-size:12px;color:var(--muted);display:block;margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;z-index:50;overflow-y:auto;
  }
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;max-width:560px;width:100%;}
  .modal h2{font-family:Georgia,serif;font-size:18px;margin:0 0 4px;}
  .modal .hint{color:var(--muted);font-size:12px;margin-bottom:10px;line-height:1.6;}
  .deck-list-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--bg);
  }
  .deck-list-item.selected{border-color:var(--gold);}
  .deck-name{font-family:Georgia,serif;font-size:14.5px;}
  .deck-meta{color:var(--muted);font-size:11.5px;margin-top:2px;}
  .stat-bar{display:flex;gap:22px;margin:14px 0 18px;font-size:12.5px;color:var(--muted);}
  .stat-bar b{color:var(--text);font-size:15px;display:block;font-family:Georgia,serif;}
  .legend{display:flex;gap:18px;font-size:11.5px;color:var(--muted);margin-bottom:14px;align-items:center;}
  .legend .chip{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:14px;height:14px;border-radius:3px;}
  .swatch.shared{background:linear-gradient(135deg,#f5da8a,var(--gold));}
  .swatch.unique{background:var(--surface2);border:1px solid var(--border);opacity:.5;}
  .card-row{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:8px 12px;border-radius:6px;margin-bottom:4px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;
    border-left:3px solid transparent;
  }
  .card-row.shared{
    background:linear-gradient(90deg, rgba(212,175,55,.14), transparent 70%);
    border-left-color:var(--gold);
  }
  .card-row.unique{opacity:.42;}
  .card-row .cname{flex:1;padding-right:10px;}
  .card-row .ccount{color:var(--muted);width:26px;text-align:right;flex-shrink:0;}
  .card-row .cwhere{color:#e0c25f;font-size:11px;font-family:-apple-system,sans-serif;margin-left:10px;flex-shrink:0;}
  .empty{color:var(--muted);font-size:13px;padding:20px 4px;text-align:center;}
  .top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .confirm-inline{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);}
  select{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px 10px;border-radius:7px;font-size:13.5px;font-family:Georgia,serif;}
  .parse-preview{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:10px 12px;font-size:12px;color:var(--muted);margin-top:8px;}
  .badge{font-size:10.5px;background:var(--surface2);color:var(--muted);padding:2px 7px;border-radius:10px;margin-left:6px;}
  a{color:#e0c25f;}
</style>
</head>

<script>
const SECTION_RE = {
  side: /^(sideboard|side\s*-?board|sb|サイドボード)\s*:?\s*$/i,
  maybe: /^(maybeboard|maybe\s*-?board|考え中|気になるカード|検討中|カード候補)\s*:?\s*$/i,
  commander: /^(commander|統率者)\s*:?\s*$/i,
  main: /^(deck|mainboard|main\s*-?board|メインボード|デッキ)\s*:?\s*$/i
};
const PERSON_COLORS = ['#e8c96b','#5fa8d3','#7fb37a','#c1443c','#a389cf','#5fc2c2'];

let state = { people: [], currentPersonId: null, decksByPerson: {}, currentDeckId: null,
              modal: null, modalDraft: null, personDraft: null, pendingDelete: null, loaded:false };

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

async function storageGet(key){
  if(firebaseReady){
    try{
      const doc = await db.collection('kv').doc(key).get();
      if(doc.exists) return JSON.parse(doc.data().value);
      return null;
    }catch(e){ console.error('firestore get failed, falling back to local storage', e); }
  }
  try{
    const raw = localStorage.getItem('mtgds:'+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  let ok = false;
  if(firebaseReady){
    try{
      await db.collection('kv').doc(key).set({ value: JSON.stringify(value) });
      ok = true;
    }catch(e){ console.error('firestore set failed, saving locally only', e); }
  }
  try{
    localStorage.setItem('mtgds:'+key, JSON.stringify(value));
    ok = true;
  }catch(e){ console.error('local storage set failed', e); }
  return ok;
}

async function loadAll(){
  const people = await storageGet('people-list');
  state.people = people || [];
  if(state.people.length && !state.currentPersonId) state.currentPersonId = state.people[0].id;
  for(const p of state.people){
    const decks = await storageGet('decks-'+p.id);
    state.decksByPerson[p.id] = decks || [];
  }
  state.loaded = true;
  render();
}

async function savePeople(){ await storageSet('people-list', state.people); }
async function saveDecks(personId){ await storageSet('decks-'+personId, state.decksByPerson[personId] || []); }

// ---------- decklist parsing ----------
function parseDecklist(raw){
  const lines = (raw || '').split(/\r?\n/);
  let section = 'main';
  const buckets = { main:{}, side:{}, maybe:{} };
  for(let rawLine of lines){
    let line = rawLine.trim();
    if(!line) continue;
    const commentMatch = line.match(/^\/\/\s*(.+)$/);
    if(commentMatch){
      const h = commentMatch[1].trim();
      if(SECTION_RE.side.test(h)) section='side';
      else if(SECTION_RE.maybe.test(h)) section='maybe';
      else if(SECTION_RE.commander.test(h) || SECTION_RE.main.test(h)) section='main';
      continue;
    }
    if(SECTION_RE.side.test(line)){ section='side'; continue; }
    if(SECTION_RE.maybe.test(line)){ section='maybe'; continue; }
    if(SECTION_RE.commander.test(line) || SECTION_RE.main.test(line)){ section='main'; continue; }

    let count = 1, name = line;
    let m = line.match(/^(\d+)\s*[xX]?\s+(.+)$/);
    if(m){ count = parseInt(m[1],10); name = m[2]; }
    else{
      let m2 = line.match(/^(.+?)\s*[xX]\s*(\d+)$/);
      if(m2){ name = m2[1]; count = parseInt(m2[2],10); }
    }
    name = name.replace(/\s*\([A-Za-z0-9]{2,6}\)\s*[\w-]*\s*$/,'').trim();
    if(!name) continue;
    buckets[section][name] = (buckets[section][name] || 0) + count;
  }
  const toArr = obj => Object.entries(obj).map(([name,count])=>({name,count}))
    .sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  return { main: toArr(buckets.main), side: toArr(buckets.side), maybe: toArr(buckets.maybe) };
}

async function tryFetchFromUrl(url){
  try{
    const res = await fetch(url);
    const html = await res.text();
    const m = html.match(/(\d+)\s+[^\n]{2,60}/g);
    if(!m || m.length < 5) return null;
    return html;
  }catch(e){ return null; }
}

// ---------- render ----------
function render(){
  const app = document.getElementById('app');
  if(!state.loaded){ app.innerHTML = '<p class="sub">読み込み中…</p>'; return; }

  let html = '';
  html += `<h1>デッキ入替アシスタント</h1>`;
  html += `<p class="sub">複数のコマンダーデッキを登録しておくと、他のデッキと共有しているカード（＝入替が必要なカード）を一目で確認できます。リンクを知っている人だけがアクセスでき、ログインは不要です。</p>`;
  if(!firebaseReady){
    html += `<div class="card" style="border-color:var(--danger-dim)"><p style="margin:0;font-size:12.5px;color:#f0a49e;">オンライン同期が読み込めなかったため、この端末だけに保存するモードで動作しています（他の人とはまだ共有されません）。ページを再読み込みすると自動的に復旧を試みます。</p></div>`;
  }

  html += `<div class="card"><div class="top-actions"><div class="row" id="person-pills">`;
  state.people.forEach((p)=>{
    const active = p.id === state.currentPersonId ? 'active' : '';
    html += `<div class="pill ${active}" data-action="select-person" data-id="${p.id}">
      <span class="dot" style="background:${p.color}"></span>${escapeHtml(p.name)}
      <span class="btn ghost small" style="padding:0 4px;margin-left:4px" data-action="delete-person" data-id="${p.id}">×</span>
    </div>`;
  });
  html += `</div><button class="btn" data-action="add-person">＋ 人を追加</button></div>`;
  if(state.pendingDelete && state.pendingDelete.type==='person'){
    html += renderConfirm(`「${escapeHtml(personName(state.pendingDelete.id))}」を削除しますか？登録された全デッキも削除されます。`, 'confirm-delete-person');
  }
  html += `</div>`;

  if(!state.currentPersonId){
    html += `<div class="card empty">まずは「＋ 人を追加」から利用者を登録してください（例：あなたの名前や友人の名前）。</div>`;
    app.innerHTML = html;
    return;
  }

  const decks = state.decksByPerson[state.currentPersonId] || [];

  html += `<div class="card"><div class="top-actions"><h2 style="font-family:Georgia,serif;font-size:16px;margin:0;">登録デッキ</h2>
    <button class="btn primary" data-action="add-deck">＋ デッキを登録</button></div>`;
  if(!decks.length){
    html += `<div class="empty">まだデッキが登録されていません。Hareruyaのデッキページから「テキストで書き出し」した内容を貼り付けて登録しましょう。</div>`;
  } else {
    decks.forEach(d=>{
      const sel = d.id === state.currentDeckId ? 'selected' : '';
      html += `<div class="deck-list-item ${sel}">
        <div style="cursor:pointer;flex:1" data-action="select-deck" data-id="${d.id}">
          <div class="deck-name">${escapeHtml(d.name)}</div>
          <div class="deck-meta">メイン ${d.main.length} 種${d.side && d.side.length ? ' ／ サイド '+d.side.length+' 種（比較対象外）':''}</div>
        </div>
        <div class="row">
          <button class="btn small" data-action="edit-deck" data-id="${d.id}">編集</button>
          <button class="btn small danger" data-action="ask-delete-deck" data-id="${d.id}">削除</button>
        </div>
      </div>`;
      if(state.pendingDelete && state.pendingDelete.type==='deck' && state.pendingDelete.id===d.id){
        html += renderConfirm(`「${escapeHtml(d.name)}」を削除しますか？`, 'confirm-delete-deck');
      }
    });
  }
  html += `</div>`;

  if(decks.length){
    if(!state.currentDeckId || !decks.find(d=>d.id===state.currentDeckId)){
      state.currentDeckId = decks[0].id;
    }
    const deck = decks.find(d=>d.id===state.currentDeckId);
    const others = decks.filter(d=>d.id!==deck.id);
    const otherCardMap = {};
    others.forEach(o=>{
      o.main.forEach(c=>{
        if(!otherCardMap[c.name]) otherCardMap[c.name]=[];
        otherCardMap[c.name].push(o.name);
      });
    });
    const sharedCount = deck.main.filter(c=>otherCardMap[c.name]).length;

    html += `<div class="card">
      <div class="top-actions">
        <h2 style="font-family:Georgia,serif;font-size:16px;margin:0;">本日使うデッキ</h2>
        <select data-bind="select-deck">
          ${decks.map(d=>`<option value="${d.id}" ${d.id===deck.id?'selected':''}>${escapeHtml(d.name)}</option>`).join('')}
        </select>
      </div>
      <div class="stat-bar">
        <div><b>${deck.main.length}</b>メイン種類数</div>
        <div><b style="color:#e0c25f">${sharedCount}</b>他デッキと共有中</div>
        <div><b>${deck.main.length-sharedCount}</b>このデッキ専用</div>
      </div>
      <div class="legend">
        <span class="chip"><span class="swatch shared"></span>共有中（入替チェック対象）</span>
        <span class="chip"><span class="swatch unique"></span>このデッキ専用</span>
      </div>`;
    if(!deck.main.length){
      html += `<div class="empty">メインボードのカードがありません。</div>`;
    } else {
      deck.main.forEach(c=>{
        const shared = otherCardMap[c.name];
        html += `<div class="card-row ${shared?'shared':'unique'}">
          <span class="cname">${escapeHtml(c.name)}</span>
          ${shared ? `<span class="cwhere">※ ${shared.map(escapeHtml).join('・')}</span>` : ''}
          <span class="ccount">×${c.count}</span>
        </div>`;
      });
    }
    html += `</div>`;
  }

  if(state.modal === 'deck-edit'){
    html += renderDeckModal();
  }
  if(state.modal === 'add-person'){
    html += renderAddPersonModal();
  }

  app.innerHTML = html;
  const focusId = state.modal === 'add-person' ? 'person-name-input'
    : (state.modal === 'deck-edit' ? 'deck-name-input' : null);
  if(focusId){
    const el = document.getElementById(focusId);
    if(el) el.focus();
  }
}

function renderAddPersonModal(){
  const d = state.personDraft;
  return `<div class="overlay" data-overlay-for="person">
    <div class="modal">
      <h2>利用者を追加</h2>
      <p class="hint">あなたや友人の名前を入力してください。デッキ入れ替えの単位（＝その人が持っている複数デッキ）ごとに管理されます。</p>
      <label>名前</label>
      <input type="text" id="person-name-input" data-bind="person-name" value="${escapeAttr(d.name)}" placeholder="例：たろう">
      ${d.error ? `<p style="color:#f0a49e;font-size:12px;margin-top:8px">${escapeHtml(d.error)}</p>` : ''}
      <div class="row" style="margin-top:16px;justify-content:flex-end">
        <button class="btn ghost" data-action="close-person-modal">キャンセル</button>
        <button class="btn primary" data-action="confirm-add-person">追加</button>
      </div>
    </div>
  </div>`;
}

function renderConfirm(msg, action){
  return `<div class="confirm-inline" style="margin-top:8px">${escapeHtml(msg)}
    <button class="btn small danger" data-action="${action}">削除する</button>
    <button class="btn small ghost" data-action="cancel-delete">キャンセル</button>
  </div>`;
}

function renderDeckModal(){
  const d = state.modalDraft;
  const preview = parseDecklist(d.raw);
  return `<div class="overlay" data-overlay-for="deck">
    <div class="modal">
      <h2>${d.id ? 'デッキを編集' : 'デッキを登録'}</h2>
      <p class="hint">Hareruyaのデッキ構築ページで「テキストで書き出し」（Magic Online / MTG Arena形式）した内容をコピーして貼り付けてください。サイドボード・気になるカードのリストは自動で除外され、共有チェックの対象になりません。</p>
      <label>デッキ名</label>
      <input type="text" id="deck-name-input" data-bind="deck-name" value="${escapeAttr(d.name)}" placeholder="例：アグロ赤単、アーティファクト統率者...">
      <label>HareruyaデッキURL（任意・自動取得を試みます）</label>
      <input type="text" id="deck-url-input" data-bind="deck-url" value="${escapeAttr(d.url||'')}" placeholder="https://www.hareruyamtg.com/decks/xxxxx">
      <div class="row" style="margin-top:8px">
        <button class="btn small" data-action="try-auto-fetch">URLから自動取得を試す</button>
        ${d.fetchStatus ? `<span class="badge">${escapeHtml(d.fetchStatus)}</span>` : ''}
      </div>
      <label>デッキリスト（貼り付け）</label>
      <textarea id="deck-raw-input" data-bind="deck-raw" rows="10" placeholder="1 Sol Ring&#10;1 Command Tower&#10;...&#10;&#10;Sideboard&#10;1 ...">${escapeHtml(d.raw)}</textarea>
      <div class="parse-preview">解析結果：メイン ${preview.main.length} 種 ／ サイド ${preview.side.length} 種 ／ 気になるカード ${preview.maybe.length} 種（サイド・気になるカードは共有チェック対象外です）</div>
      ${d.error ? `<p style="color:#f0a49e;font-size:12px;margin-top:8px">${escapeHtml(d.error)}</p>` : ''}
      <div class="row" style="margin-top:16px;justify-content:flex-end">
        <button class="btn ghost" data-action="close-deck-modal">キャンセル</button>
        <button class="btn primary" data-action="save-deck-modal">保存</button>
      </div>
    </div>
  </div>`;
}

// ---------- actions ----------
function personName(id){ const p = state.people.find(p=>p.id===id); return p?p.name:''; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function openAddPersonModal(){
  state.personDraft = { name:'', error:null };
  state.modal = 'add-person';
  render();
}
function closePersonModal(){ state.modal = null; state.personDraft = null; render(); }
function updatePersonDraftName(v){ state.personDraft.name = v; }
async function confirmAddPerson(){
  const name = (state.personDraft.name || '').trim();
  if(!name){ state.personDraft.error = '名前を入力してください'; render(); return; }
  const p = { id: uid(), name, color: PERSON_COLORS[state.people.length % PERSON_COLORS.length] };
  state.people.push(p);
  state.decksByPerson[p.id] = [];
  state.currentPersonId = p.id;
  state.modal = null; state.personDraft = null;
  await savePeople();
  render();
}
function selectPerson(id){ state.currentPersonId = id; state.currentDeckId = null; render(); }
function askDeletePerson(id){ state.pendingDelete = { type:'person', id }; render(); }
function askDeleteDeck(id){ state.pendingDelete = { type:'deck', id }; render(); }
function cancelDelete(){ state.pendingDelete = null; render(); }
async function confirmDeletePerson(){
  const id = state.pendingDelete.id;
  state.people = state.people.filter(p=>p.id!==id);
  delete state.decksByPerson[id];
  if(state.currentPersonId === id) state.currentPersonId = (state.people[0] ? state.people[0].id : null);
  state.pendingDelete = null;
  await savePeople();
  await storageSet('decks-'+id, []);
  render();
}
async function confirmDeleteDeck(){
  const id = state.pendingDelete.id;
  const pid = state.currentPersonId;
  state.decksByPerson[pid] = state.decksByPerson[pid].filter(d=>d.id!==id);
  if(state.currentDeckId === id) state.currentDeckId = null;
  state.pendingDelete = null;
  await saveDecks(pid);
  render();
}
function selectDeck(id){ state.currentDeckId = id; render(); }

function openDeckModal(deckId){
  if(deckId){
    const d = state.decksByPerson[state.currentPersonId].find(d=>d.id===deckId);
    state.modalDraft = { id:d.id, name:d.name, url:d.url||'', raw:d.raw||'', fetchStatus:null, error:null };
  } else {
    state.modalDraft = { id:null, name:'', url:'', raw:'', fetchStatus:null, error:null };
  }
  state.modal = 'deck-edit';
  render();
}
function closeModal(){ state.modal = null; state.modalDraft = null; render(); }
function updateDraftName(v){ state.modalDraft.name = v; }
function updateDraftUrl(v){ state.modalDraft.url = v; }
function updateDraftRaw(v){
  state.modalDraft.raw = v;
  const preview = parseDecklist(v);
  const previewEl = document.querySelector('.modal .parse-preview');
  if(previewEl){
    previewEl.textContent = `解析結果：メイン ${preview.main.length} 種 ／ サイド ${preview.side.length} 種 ／ 気になるカード ${preview.maybe.length} 種（サイド・気になるカードは共有チェック対象外です）`;
  }
}

async function tryAutoFetch(){
  const url = state.modalDraft.url;
  if(!url){ state.modalDraft.fetchStatus = 'URLを入力してください'; render(); return; }
  state.modalDraft.fetchStatus = '取得中…';
  render();
  const html = await tryFetchFromUrl(url);
  if(!html){
    state.modalDraft.fetchStatus = '自動取得できませんでした。下の欄に手動で貼り付けてください';
  } else {
    state.modalDraft.fetchStatus = 'ページは取得できましたが解析できる形式ではありませんでした。下の欄に手動で貼り付けてください';
  }
  render();
}

async function saveDeckModal(){
  const d = state.modalDraft;
  if(!d.name.trim()){ d.error = 'デッキ名を入力してください'; render(); return; }
  d.error = null;
  const parsed = parseDecklist(d.raw);
  const pid = state.currentPersonId;
  const list = state.decksByPerson[pid];
  if(d.id){
    const existing = list.find(x=>x.id===d.id);
    existing.name = d.name.trim();
    existing.url = d.url;
    existing.raw = d.raw;
    existing.main = parsed.main;
    existing.side = parsed.side;
    existing.maybe = parsed.maybe;
    existing.updatedAt = Date.now();
  } else {
    const newDeck = { id: uid(), name: d.name.trim(), url: d.url, raw: d.raw,
                       main: parsed.main, side: parsed.side, maybe: parsed.maybe, updatedAt: Date.now() };
    list.push(newDeck);
    state.currentDeckId = newDeck.id;
  }
  await saveDecks(pid);
  state.modal = null; state.modalDraft = null;
  render();
}

// ---------- event delegation (no inline handlers) ----------
const appEl = document.getElementById('app');

appEl.addEventListener('click', function(e){
  if(e.target.classList && e.target.classList.contains('overlay')){
    const kind = e.target.getAttribute('data-overlay-for');
    if(kind === 'deck') closeModal();
    else if(kind === 'person') closePersonModal();
    return;
  }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');
  switch(action){
    case 'select-person': selectPerson(id); break;
    case 'delete-person': askDeletePerson(id); break;
    case 'add-person': openAddPersonModal(); break;
    case 'confirm-delete-person': confirmDeletePerson(); break;
    case 'confirm-delete-deck': confirmDeleteDeck(); break;
    case 'cancel-delete': cancelDelete(); break;
    case 'select-deck': selectDeck(id); break;
    case 'edit-deck': openDeckModal(id); break;
    case 'ask-delete-deck': askDeleteDeck(id); break;
    case 'add-deck': openDeckModal(null); break;
    case 'close-person-modal': closePersonModal(); break;
    case 'confirm-add-person': confirmAddPerson(); break;
    case 'close-deck-modal': closeModal(); break;
    case 'try-auto-fetch': tryAutoFetch(); break;
    case 'save-deck-modal': saveDeckModal(); break;
  }
});

appEl.addEventListener('input', function(e){
  const bind = e.target.getAttribute('data-bind');
  if(!bind) return;
  const v = e.target.value;
  switch(bind){
    case 'person-name': updatePersonDraftName(v); break;
    case 'deck-name': updateDraftName(v); break;
    case 'deck-url': updateDraftUrl(v); break;
    case 'deck-raw': updateDraftRaw(v); break;
  }
});

appEl.addEventListener('change', function(e){
  if(e.target.tagName === 'SELECT' && e.target.getAttribute('data-bind') === 'select-deck'){
    selectDeck(e.target.value);
  }
});

appEl.addEventListener('change', function(e){
  if(e.target.tagName === 'SELECT' && e.target.getAttribute('data-bind') === 'select-deck'){
    selectDeck(e.target.value);
  }
});

async function init() {

  if (firebaseReady) {
    try {
      await firebase.auth().signInAnonymously();
    } catch (e) {
      console.error("匿名ログイン失敗", e);
    }
  }

  await loadAll();

}

init();
</script>
